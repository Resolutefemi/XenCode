[package]
name = "xencode-script"
description = "XenCode automation core — QuickJS scripts with the xen.* host bridge, no npm/node/python required"
version = "3.17.2"
edition = "2021"
license = "Apache-2.0"
authors = ["Resolute Femi <ariyooluwafemi487@gmail.com>"]
repository = "https://github.com/Resolutefemi/XenCode"

[dependencies]
rquickjs = { version = "0.14", features = ["full-async", "array-buffer", "classes", "properties"] }
# Phase 7: XenRE — binary analysis surfaced as xen.re hooks.
xencode-re = { path = "../re" }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "process", "io-util", "time", "sync", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
base64 = "0.22"
getrandom = "0.3"
url = "2"
notify = "8"
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
toml = "0.9"
serde_yaml = "0.9"
csv = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.37", features = ["bundled"] }
semver = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
glob = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cron = "0.15"
futures-util = "0.3"
regex = "1"
oxc_parser = "0.158"
oxc_ast = "0.158"
oxc_span = "0.158"
oxc_semantic = "0.158"
oxc_transformer = "0.158"
oxc_codegen = "0.158"
oxc_allocator = "0.158"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "xen-script"
path = "src/bin/xen-script.rs"

[lib]
name = "xencode_script"
path = "src/lib.rs"
