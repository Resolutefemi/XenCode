name: 💡 Feature Request
description: Propose a new feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Before submitting, please search [existing issues](../../issues?q=is%3Aissue+) to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Use case / problem to solve
      description: Describe the real scenario and pain point you hit — that helps the design more than jumping straight to a proposed solution.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Desired solution
      description: What you would like the feature or interaction to look like.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches you have considered, or how you work around it today.

  - type: textarea
    id: extra
    attributes:
      label: Additional information
      description: Screenshots, reference products (how similar apps handle it), etc.
