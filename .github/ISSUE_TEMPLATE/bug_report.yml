name: 🐛 Bug Report
description: Report a problem you ran into while using the app
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the feedback! Please fill in as much detail as you can — the more complete the information, the faster the issue can be located.
        Before submitting, please search [existing issues](../../issues?q=is%3Aissue+) to avoid duplicates.

  - type: textarea
    id: description
    attributes:
      label: Issue description
      description: Briefly describe what went wrong.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How do you trigger the issue? E.g. 1. Open Settings → 2. Tap AI providers → 3. ...
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: What you expected to happen, and what actually happened.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown on the settings page, or under Settings → About. E.g. 1.7.0 or 1.7.0-rc1.
    validations:
      required: true

  - type: dropdown
    id: terminal_mode
    attributes:
      label: Terminal mode
      options:
        - Local container (PRoot)
        - Remote SSH
        - Reproducible in both
        - Terminal not involved
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: E.g. Pixel 8 / Android 15, or Xiaomi 14 / HyperOS 2
    validations:
      required: true

  - type: input
    id: provider_model
    attributes:
      label: AI provider and model
      description: Fill in if the issue involves AI conversations, e.g. DeepSeek / deepseek-chat. Otherwise leave it blank.

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs are located under Android/data/<package name>/files/logs/. If the issue involves a crash or an exception, paste the relevant excerpt (remember to redact API keys).
        They can be viewed directly under Settings → Logs.

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / screen recordings
      description: Images or videos that help explain the issue (drag and drop to upload; be careful to cover sensitive information).
