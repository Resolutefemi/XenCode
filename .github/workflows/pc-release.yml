name: PC Release (Rust CLI + Desktop)

# Tag-driven release for the Rust PC line: push a tag `pc-v2.0.0` (or run
# manually) and every artifact — the CLI for Windows/macOS/Linux plus the
# desktop packages (deb, zip, .app/zip) — is built simultaneously and attached
# to a GitHub Release. The Android app keeps its own android-release.yml.

on:
  push:
    tags: [ 'pc-v*' ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --workspace
        working-directory: rust

  cli:
    name: CLI ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: xencode-cli-linux-amd64.tar.gz
          - os: windows-latest
            archive: xencode-cli-windows-amd64.zip
          - os: macos-latest
            archive: xencode-cli-macos-arm64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --release -p xencode-cli
        working-directory: rust
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          stage=$(mktemp -d)
          cp rust/target/release/xencode "$stage/"
          cp -r art "$stage/art"
          cp README.md "$stage/"
          tar -czf "${{ matrix.archive }}" -C "$stage" .
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item rust/target/release/xencode.exe stage/
          Copy-Item art stage -Recurse
          Copy-Item README.md stage/
          Compress-Archive -Path stage/* -DestinationPath ${{ matrix.archive }} -Force
      - uses: actions/upload-artifact@v4
        with:
          name: rel-${{ matrix.archive }}
          path: ${{ matrix.archive }}

  desktop:
    name: Desktop ${{ matrix.os }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libxcb1-dev libwayland-dev
      - run: cargo build --release -p xencode-desktop
        working-directory: rust
      - name: Package deb (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked || cargo install cargo-deb
          cargo deb -p xencode-desktop
          mv target/debian/*.deb ../xencode-desktop-linux-amd64.deb
        working-directory: rust
      - name: Package zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item rust/target/release/xencode-desktop.exe stage/
          Copy-Item art/xencode-icon-512.png stage/xencode.png
          Compress-Archive -Path stage/* -DestinationPath xencode-desktop-windows-amd64.zip -Force
      - name: Package app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=Xencode.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp rust/target/release/xencode-desktop "$APP/Contents/MacOS/"
          cp art/xencode-icon-512.png /tmp/xencode.png
          mkdir -p /tmp/xencode.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size /tmp/xencode.png --out /tmp/xencode.iconset/icon_${size}x${size}.png
          done
          iconutil -c icns /tmp/xencode.iconset -o "$APP/Contents/Resources/xencode.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>XenCode</string>
            <key>CFBundleDisplayName</key><string>XenCode</string>
            <key>CFBundleIdentifier</key><string>com.xencode.desktop</string>
            <key>CFBundleVersion</key><string>2.0.0</string>
            <key>CFBundleShortVersionString</key><string>2.0.0</string>
            <key>CFBundleIconFile</key><string>xencode</string>
            <key>CFBundleExecutable</key><string>xencode-desktop</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          zip -qry xencode-desktop-macos-arm64.zip "$APP"
      - uses: actions/upload-artifact@v4
        with:
          name: rel-desktop-${{ matrix.target }}
          path: xencode-desktop-*

  release:
    name: Attach to GitHub Release
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
