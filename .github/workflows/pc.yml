name: PC (CLI + Desktop)

# PC line: shared JVM core, CLI and Compose Desktop app for Windows/macOS/Linux.
# Android CI lives in ci.yml; this workflow covers :core/:cli/:desktop only.

on:
  push:
    branches: [ main ]
    paths:
      - 'core/**'
      - 'cli/**'
      - 'desktop/**'
      - '.github/workflows/pc.yml'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
  pull_request:
    paths:
      - 'core/**'
      - 'cli/**'
      - 'desktop/**'
      - '.github/workflows/pc.yml'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
  workflow_dispatch:

concurrency:
  group: pc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: JVM tests (core / cli / desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run unit tests
        run: ./gradlew :core:test :cli:test :desktop:test --console=plain

  cli-dist:
    name: CLI distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build install distribution
        run: ./gradlew :cli:installDist --console=plain
      - name: Package
        run: |
          cd cli/build/install/xencode
          tar -czf ../../../xencode-cli-linux-amd64.tar.gz .
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: xencode-cli-linux-amd64
          path: cli/build/xencode-cli-linux-amd64.tar.gz

  desktop-package:
    name: Desktop package (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tasks: :desktop:packageDeb
            format: deb
          - os: windows-latest
            tasks: :desktop:packageMsi
            format: msi
          - os: macos-latest
            tasks: :desktop:packageDmg
            format: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build native package
        run: ./gradlew ${{ matrix.tasks }} --console=plain
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: xencode-desktop-${{ matrix.format }}
          path: |
            desktop/build/compose/binaries/main/**
