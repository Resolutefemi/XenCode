name: PC (CLI + Desktop + Rust)

# PC line: shared JVM core, CLI and Compose Desktop app for Windows/macOS/Linux,
# plus the Rust workspace (egui desktop rewrite + XenCloud Axum backend).
# The CLI is distributed for all three operating systems and the desktop app is
# packaged in the native formats of each (deb+rpm, msi+exe, dmg) — everything
# built simultaneously from the same commit. The mobile app lives in XenAI.

on:
  push:
    branches: [ main ]
    paths:
      - 'core/**'
      - 'cli/**'
      - 'desktop/**'
      - 'rust/**'
      - '.github/workflows/pc.yml'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
  pull_request:
    paths:
      - 'core/**'
      - 'cli/**'
      - 'desktop/**'
      - 'rust/**'
      - '.github/workflows/pc.yml'
      - 'gradle/**'
      - 'gradlew'
      - 'gradle.properties'
  workflow_dispatch:

concurrency:
  group: pc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: JVM tests (core / cli / desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run unit tests
        run: ./gradlew :core:test :cli:test :desktop:test --console=plain

  rust:
    name: Rust (xencode-desktop + xencode-cloud)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (egui build)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-x11-0 libxcb-xkb1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (desktop + cloud, memory store + mock provider)
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release --workspace
      - name: Upload XenCloud binary
        uses: actions/upload-artifact@v4
        with:
          name: xencloud-linux-amd64
          path: rust/target/release/xencode-cloud
      - name: Upload egui desktop binary
        uses: actions/upload-artifact@v4
        with:
          name: xencode-desktop-rust-linux-amd64
          path: rust/target/release/xencode-desktop

  cli-dist:
    name: CLI distribution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: xencode-cli-linux-amd64.tar.gz
            pack: tar -czf
          - os: windows-latest
            archive: xencode-cli-windows-amd64.zip
            pack: powershell Compress-Archive -Path * -DestinationPath
          - os: macos-latest
            archive: xencode-cli-macos-universal.tar.gz
            pack: tar -czf
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build install distribution
        run: ./gradlew :cli:installDist --console=plain
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd cli/build/install/xencode
          tar -czf ../../../${{ matrix.archive }} .
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Push-Location cli/build/install/xencode
          Compress-Archive -Path * -DestinationPath ../../../${{ matrix.archive }} -Force
          Pop-Location
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: cli/build/${{ matrix.archive }}

  desktop-package:
    name: Desktop ${{ matrix.format }} (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tasks: :desktop:packageDeb :desktop:packageRpm
            format: deb-rpm
          - os: windows-latest
            tasks: :desktop:packageMsi :desktop:packageExe
            format: msi-exe
          - os: macos-latest
            tasks: :desktop:packageDmg
            format: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install rpmbuild (Linux rpm packaging)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build native package
        run: ./gradlew ${{ matrix.tasks }} --console=plain
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: xencode-desktop-${{ matrix.format }}
          path: |
            desktop/build/compose/binaries/main/**
