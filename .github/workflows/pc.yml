name: PC (Rust CLI + Desktop)

# XenCode PC line: Rust workspace (xencode-core, xencode-automation with
# embedded rquickjs, xencode-cli, xencode-desktop). The CLI is built for all
# three operating systems and the desktop app is packaged in the native
# formats of each (deb + tar.gz, zip, dmg/app) — everything from the same
# commit. Android CI lives in ci.yml.

on:
  push:
    branches: [ main ]
    paths:
      - 'rust/**'
      - 'art/**'
      - '.github/workflows/pc.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'art/**'
      - '.github/workflows/pc.yml'
  workflow_dispatch:

concurrency:
  group: pc-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust tests + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Unit + integration tests (73 checks)
        run: cargo test --workspace
        working-directory: rust
      - name: Clippy (zero warnings gate)
        run: cargo clippy --workspace -- -D warnings
        working-directory: rust

  cli-dist:
    name: CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive: xencode-cli-linux-amd64.tar.gz
          - os: windows-latest
            archive: xencode-cli-windows-amd64.zip
          - os: macos-latest
            archive: xencode-cli-macos-arm64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build CLI (release)
        run: cargo build --release -p xencode-cli
        working-directory: rust
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          stage=$(mktemp -d)
          cp rust/target/release/xencode "$stage/"
          cp -r art "$stage/art"
          cp README.md "$stage/"
          tar -czf "${{ matrix.archive }}" -C "$stage" .
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item rust/target/release/xencode.exe stage/
          Copy-Item art stage -Recurse
          Copy-Item README.md stage/
          Compress-Archive -Path stage/* -DestinationPath ${{ matrix.archive }} -Force
      - name: Verify the binary answers --version
        if: runner.os != 'Windows'
        run: ./rust/target/release/xencode --version
      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  desktop-package:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libxcb1-dev libwayland-dev
      - name: Build desktop (release)
        run: cargo build --release -p xencode-desktop
        working-directory: rust
      - name: Package deb (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked || cargo install cargo-deb
          cargo deb -p xencode-desktop
          mv target/debian/*.deb ../xencode-desktop-linux-amd64.deb
        working-directory: rust
      - name: Package zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item rust/target/release/xencode-desktop.exe stage/
          Copy-Item art/xencode-icon-512.png stage/xencode.png
          Compress-Archive -Path stage/* -DestinationPath xencode-desktop-windows-amd64.zip -Force
      - name: Package app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          APP=Xencode.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp rust/target/release/xencode-desktop "$APP/Contents/MacOS/"
          cp art/xencode-icon-512.png /tmp/xencode.png
          mkdir -p /tmp/xencode.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size /tmp/xencode.png --out /tmp/xencode.iconset/icon_${size}x${size}.png
          done
          iconutil -c icns /tmp/xencode.iconset -o "$APP/Contents/Resources/xencode.icns"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>XenCode</string>
            <key>CFBundleDisplayName</key><string>XenCode</string>
            <key>CFBundleIdentifier</key><string>com.xencode.desktop</string>
            <key>CFBundleVersion</key><string>2.0.0</string>
            <key>CFBundleShortVersionString</key><string>2.0.0</string>
            <key>CFBundleIconFile</key><string>xencode</string>
            <key>CFBundleExecutable</key><string>xencode-desktop</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          zip -qry xencode-desktop-macos-arm64.zip "$APP"
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: xencode-desktop-${{ matrix.target }}
          path: |
            xencode-desktop-*
