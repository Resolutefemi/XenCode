[package]
name = "xencode-app"
description = "XenCode desktop - 100% Rust native GUI, ZCode v3.17.2 pixel-faithful"
version = "3.17.2"
edition = "2021"
license = "Apache-2.0"
authors = ["Resolute Femi <ariyooluwafemi487@gmail.com>"]
repository = "https://github.com/Resolutefemi/XenCode"

[[bin]]
name = "xencode"
path = "src/main.rs"

[dependencies]
tiny-skia = { version = "0.11", features = ["png"] }
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "fs", "process", "io-util", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
regex = "1"
# Phase 5: agent-loop hooks run through the QuickJS automation core.
xencode-script = { path = "../script" }
# Phase 5 repo map: tree-sitter symbol extraction (Aider-style relevance ranking).
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"

[dev-dependencies]
toml = "0.9"

