[package]
name = "xencode-app"
description = "XenCode desktop - 100% Rust native GUI, ZCode v3.17.2 pixel-faithful"
version = "3.17.2"
edition = "2021"
license = "Apache-2.0"
authors = ["Resolute Femi <ariyooluwafemi487@gmail.com>"]
repository = "https://github.com/Resolutefemi/XenCode"

[[bin]]
name = "xencode"
path = "src/main.rs"

[dependencies]
tiny-skia = { version = "0.11", features = ["png"] }
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
