<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="__ASSET_BASE____MD_CSS__">
<link rel="stylesheet" href="__ASSET_BASE____HL_CSS__">
<style>
  html, body { margin: 0; padding: 0; background-color: __BG__; }
  /* Leave some top spacing for in-page anchor jumps so headings are not flush against the edge */
  .markdown-body { box-sizing: border-box; min-width: 200px; max-width: 980px; margin: 0 auto; padding: 16px; }
  /* Constrain body image width so large screenshots do not overflow the screen; tap behavior is left to the WebView default (no link) */
  .markdown-body img { max-width: 100%; }
  /* Centered blocks commonly seen in READMEs */
  .markdown-body p[align="center"], .markdown-body div[align="center"], .markdown-body h1[align="center"], .markdown-body h2[align="center"] { text-align: center; }
</style>
</head>
<body>
<article class="markdown-body" id="content"></article>
<script id="md-source" type="text/plain">__MD_B64__</script>
<script src="__ASSET_BASE__marked.min.js"></script>
<script src="__ASSET_BASE__purify.min.js"></script>
<script src="__ASSET_BASE__highlight.min.js"></script>
<script>
(function () {
  try {
    var b64 = document.getElementById('md-source').textContent.trim();
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var md = new TextDecoder('utf-8').decode(bytes);

    marked.setOptions({ gfm: true, breaks: false });
    var raw = marked.parse(md);
    // Sanitize: strip script tags / event attributes etc. to prevent injected execution when previewing external markdown
    var clean = DOMPurify.sanitize(raw, { ADD_ATTR: ['align', 'target'] });

    var content = document.getElementById('content');
    content.innerHTML = clean;

    content.querySelectorAll('pre code').forEach(function (el) {
      try { hljs.highlightElement(el); } catch (e) {}
    });
    // Hide images that fail to load (network down / file missing) instead of leaving broken images
    content.querySelectorAll('img').forEach(function (img) {
      img.addEventListener('error', function () { img.style.display = 'none'; });
    });
  } catch (e) {
    document.getElementById('content').textContent = 'Markdown preview error: ' + e;
  }
})();
</script>
</body>
</html>
