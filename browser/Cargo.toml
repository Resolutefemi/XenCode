[package]
name = "xencode-browser"
description = "XenBrowser — pure-Rust CDP client driving Chromium: Spaces, snapshots, screencast (Phase 6) + network capture / API discovery (Phase 8)"
version = "3.17.2"
edition = "2021"
license = "Apache-2.0"
authors = ["Resolute Femi <ariyooluwafemi487@gmail.com>"]
repository = "https://github.com/Resolutefemi/XenCode"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs", "net"] }
base64 = "0.22"
png = "0.17"
zune-jpeg = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
jpeg-encoder = "0.6"

[lib]
name = "xencode_browser"
path = "src/lib.rs"
