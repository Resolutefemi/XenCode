[package]
name = "xencode-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "XenCode Desktop — Rust GUI for Windows, macOS and Linux"

[[bin]]
name = "xencode-desktop"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "Resolute Femi <ariyooluwafemi487@gmail.com>"
depends = "$auto"
section = "devel"
extended-description = "XenCode — autonomous coding agent desktop app (Rust)."
assets = [
    ["target/release/xencode-desktop", "usr/bin/", "755"],
    # cargo-deb resolves asset paths relative to the crate manifest
    # (rust/crates/xencode-desktop), so art/ at the repo root is three levels up.
    ["../../../art/xencode-icon-512.png", "usr/share/icons/hicolor/512x512/apps/xencode.png", "644"],
]

[dependencies]
xencode-core = { path = "../xencode-core" }
xencode-automation = { path = "../xencode-automation" }
eframe.workspace = true
image.workspace = true
rfd.workspace = true
tokio.workspace = true
serde_json.workspace = true
anyhow.workspace = true
pulldown-cmark.workspace = true
