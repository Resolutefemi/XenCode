[workspace]
resolver = "2"
members = [
    "crates/xencode-core",
    "crates/xencode-automation",
    "crates/xencode-cli",
    "crates/xencode-desktop",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Resolute Femi <ariyooluwafemi487@gmail.com>"]
repository = "https://github.com/Resolutefemi/XenCode"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync", "fs"] }
futures-util = "0.3"
async-stream = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip"] }
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
walkdir = "2"
glob = "0.3"
uuid = { version = "1", features = ["v4"] }
rquickjs = { version = "0.9", features = ["loader", "allocator", "futures"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
rustyline = "15"
eframe = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.15"
tempfile = "3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
