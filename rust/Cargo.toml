[workspace]
resolver = "2"
members = [
    "crates/xencode-app",
]

[workspace.package]
version = "3.0.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Resolute Femi <ariyooluwafemi487@gmail.com>"]
repository = "https://github.com/Resolutefemi/XenCode"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
eframe = "0.29"
egui = "0.29"
egui_extras = "0.29"
portable-pty = "0.8"
vte = "0.13"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
