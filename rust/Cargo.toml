[workspace]
resolver = "2"
members = ["crates/xencode-desktop", "crates/xencode-cloud"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/Resolutefemi/XenCode"
authors = ["Resolute Femi <ariyooluwafemi487@gmail.com>"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "rustls", "http2"] }
once_cell = "1"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
